<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文明復興・任務終端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:#33e6e6; --amber:#ffb84d; --red:#ff4d5e; --green:#46e07a; --bg:#05080f; --pixel:'Press Start 2P','Noto Sans TC','Microsoft JhengHei',monospace; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:#cfeff0;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  body{ overflow-x:hidden; }
  #stars{ position:fixed; inset:0; z-index:0; }
  .wrap{ position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .panel{ width:min(540px,94vw); background:rgba(8,16,28,.85); border:1px solid #15323f; border-radius:16px;
    padding:24px; box-shadow:0 0 40px rgba(51,230,230,.12),inset 0 0 40px rgba(51,230,230,.04); }
  h1{ font-family:var(--pixel); font-size:14px; line-height:1.7; letter-spacing:1px; margin:0 0 8px; color:var(--cyan); text-shadow:0 0 12px rgba(51,230,230,.5); }
  .sub{ font-size:12px; color:#5d7f87; margin-bottom:16px; }
  label{ display:block; font-size:13px; color:#8fb6bd; margin:14px 0 7px; }
  input[type=text]{ width:100%; padding:12px 14px; background:#04111a; border:1px solid #1c4250; border-radius:10px; color:#eafaff; font-size:16px; outline:none; font-family:inherit; }
  input:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(51,230,230,.15); }
  #ans{ letter-spacing:8px; font-size:26px; text-align:center; }
  .chars{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:7px; }
  .char{ position:relative; cursor:pointer; text-align:center; padding:9px 3px; border:1px solid #1c4250; border-radius:10px; background:#04111a; transition:transform .15s,box-shadow .15s,border-color .15s; user-select:none; overflow:hidden; }
  .char:hover{ transform:translateY(-3px); border-color:#2c5c68; }
  .char.sel{ border-color:var(--cyan); background:rgba(51,230,230,.12); box-shadow:0 0 14px rgba(51,230,230,.25); animation:selpulse 1.6s ease-in-out infinite; }
  @keyframes selpulse{ 0%,100%{ box-shadow:0 0 10px rgba(51,230,230,.2);} 50%{ box-shadow:0 0 20px rgba(51,230,230,.55);} }
  .char.sel::after{ content:''; position:absolute; left:-100%; top:0; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(51,230,230,.35),transparent); animation:scanx 1.8s linear infinite; }
  @keyframes scanx{ to{ left:140%; } }
  .char .ic{ font-size:21px; transition:transform .15s; } .char:hover .ic{ transform:scale(1.15); } .char .nm{ font-size:12px; margin-top:2px; color:#dff7fb; } .char .dm{ font-size:9px; color:#5d7f87; }
  button.go{ width:100%; margin-top:18px; padding:14px; font-size:12px; font-weight:bold; letter-spacing:2px; color:#04131a;
    background:linear-gradient(90deg,var(--cyan),#5af0c0); border:none; border-radius:10px; cursor:pointer; box-shadow:0 0 22px rgba(51,230,230,.4); font-family:var(--pixel); transition:transform .08s,box-shadow .15s; }
  button.go:active{ transform:translateY(1px) scale(.97); box-shadow:0 0 10px rgba(51,230,230,.35); }
  button.go:hover{ box-shadow:0 0 30px rgba(51,230,230,.6); }
  .msg{ margin-top:13px; min-height:20px; font-size:14px; text-align:center; }
  .err{ color:var(--red); } .ok{ color:var(--green); }
  .shake{ animation:shake .4s; } @keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
  .foot{ margin-top:16px; text-align:center; font-size:12px; } .foot a{ color:#5d7f87; cursor:pointer; } .foot a:hover{ color:var(--cyan); }
  .hd{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#8fb6bd; margin-bottom:10px; }
  .hd b{ color:#eafaff; } .score{ color:var(--amber); font-weight:bold; font-family:var(--pixel); font-size:12px; transition:text-shadow .2s; }
  .score.bump{ text-shadow:0 0 14px var(--amber); }
  .doors{ display:flex; gap:8px; margin:6px 0 12px; }
  .dot{ flex:1; height:8px; border-radius:5px; background:#13283400; border:1px solid #1c4250; transition:.2s; }
  .dot.done{ background:var(--green); box-shadow:0 0 10px var(--green); border-color:var(--green); }
  .dot.cur{ background:var(--cyan); box-shadow:0 0 10px var(--cyan); border-color:var(--cyan); animation:dotpulse 1.3s ease-in-out infinite; }
  @keyframes dotpulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
  .doortitle{ font-family:var(--pixel); font-size:12px; line-height:1.8; color:var(--cyan); margin:6px 0; } .doordesc{ font-size:13px; color:#9fc3c9; line-height:1.7; min-height:44px; }
  .typing::after{ content:'▌'; animation:caret .8s steps(1) infinite; color:var(--cyan); }
  @keyframes caret{ 50%{ opacity:0; } }
  .panel.flash-ok{ animation:flashok .5s; } @keyframes flashok{ 0%{ box-shadow:0 0 0 3px rgba(70,224,122,0),0 0 40px rgba(51,230,230,.12);} 30%{ box-shadow:0 0 0 3px rgba(70,224,122,.8),0 0 60px rgba(70,224,122,.5);} 100%{ box-shadow:0 0 0 3px rgba(70,224,122,0),0 0 40px rgba(51,230,230,.12);} }
  .panel.flash-err{ animation:flasherr .5s; } @keyframes flasherr{ 0%{ box-shadow:0 0 0 3px rgba(255,77,94,0),0 0 40px rgba(51,230,230,.12);} 30%{ box-shadow:0 0 0 3px rgba(255,77,94,.85),0 0 60px rgba(255,77,94,.5);} 100%{ box-shadow:0 0 0 3px rgba(255,77,94,0),0 0 40px rgba(51,230,230,.12);} }
  #ov{ position:fixed; inset:0; z-index:50; background:#02060c; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #ovline{ font-size:16px; color:var(--cyan); min-height:46px; max-width:600px; }
  .glitch{ font-family:var(--pixel); font-size:20px; font-weight:bold; color:var(--red); animation:gl .12s infinite; letter-spacing:2px; } @keyframes gl{ 0%{transform:translate(0)} 25%{transform:translate(-3px,2px)} 50%{transform:translate(2px,-2px)} 75%{transform:translate(-2px,-1px)} 100%{transform:translate(0)} }
  .bar{ width:min(420px,80vw); height:14px; background:#0b1a26; border:1px solid #1c4250; border-radius:8px; overflow:hidden; margin:18px 0; }
  .bar>i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--green)); box-shadow:0 0 14px var(--cyan); }
  .success{ font-family:var(--pixel); font-size:26px; line-height:1.6; font-weight:bold; color:var(--green); text-shadow:0 0 24px rgba(70,224,122,.7); letter-spacing:3px; opacity:0; transform:scale(.6); } .success.show{ animation:pop .6s forwards; } @keyframes pop{ to{opacity:1;transform:scale(1)} }
  .epi{ margin-top:14px; font-size:15px; color:#dff7fb; max-width:560px; line-height:1.8; opacity:0; } .epi.show{ animation:fin 1s forwards; } @keyframes fin{ to{opacity:1} }
  .prize{ margin-top:18px; font-size:19px; color:var(--amber); text-shadow:0 0 16px rgba(255,184,77,.5); opacity:0; } .prize.show{ animation:fin 1s forwards; }
  .again{ margin-top:22px; padding:10px 22px; background:transparent; border:1px solid #1c4250; color:#8fb6bd; border-radius:8px; cursor:pointer; font-family:inherit; opacity:0; } .again.show{ animation:fin 1s forwards; }
  #lb{ position:fixed; inset:0; z-index:60; background:rgba(2,6,12,.97); display:none; padding:26px; overflow:auto; }
  #lb h2{ font-family:var(--pixel); font-size:15px; line-height:1.8; color:var(--amber); text-align:center; letter-spacing:2px; }
  table{ width:min(640px,96vw); margin:14px auto; border-collapse:collapse; }
  th,td{ border-bottom:1px solid #15323f; padding:9px 6px; text-align:center; font-size:14px; } th{ color:var(--cyan); }
  .x{ text-align:center; margin-top:14px; } .x button{ margin:0 6px; padding:8px 16px; background:#0b1a26; color:#8fb6bd; border:1px solid #1c4250; border-radius:8px; cursor:pointer; font-family:inherit; }
  #confetti{ position:fixed; inset:0; z-index:55; pointer-events:none; display:none; }

  /* CRT scanline + vignette overlay */
  #scan{ position:fixed; inset:0; z-index:40; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0px,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px),
      radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);
    mix-blend-mode:multiply; opacity:.55; animation:flicker 6s linear infinite; }
  @keyframes flicker{ 0%,96%,100%{ opacity:.55; } 97%{ opacity:.4; } 98%{ opacity:.6; } }
  body.shake-screen{ animation:screenshake .5s; }
  @keyframes screenshake{ 0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,3px)} 40%{transform:translate(5px,-4px)} 60%{transform:translate(-4px,4px)} 80%{transform:translate(4px,-2px)} }

  /* boot sequence */
  #boot{ position:fixed; inset:0; z-index:99; background:#02060c; display:flex; align-items:center; justify-content:center;
    font-family:var(--pixel); color:var(--cyan); font-size:11px; line-height:2.1; padding:20px; text-align:left;
    white-space:pre-wrap; cursor:pointer; }
  #boot.hide{ animation:bootout .5s forwards; }
  @keyframes bootout{ to{ opacity:0; visibility:hidden; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="confetti"></canvas>
<div id="scan"></div>
<div id="boot"><div id="bootLines"></div></div>

<div class="wrap">
  <div class="panel" id="panel">
    <!-- LOGIN -->
    <div id="login">
      <h1>◤ 文明復興・任務終端 ◢</h1>
      <div class="sub">登入你的小隊，闖過三道邏輯之門，重啟世界。⚡ 每道門搶先破的組有速度獎勵（+30／+20／+10），但答錯會扣分——快，更要準！</div>
      <label>① 隊名（之後用同一個隊名繼續闖關）</label>
      <input type="text" id="team" placeholder="例：第 3 小隊" maxlength="16" autocomplete="off">
      <label>② 選擇你的復興官</label>
      <div class="chars" id="chars"></div>
      <button class="go" id="loginGo">▶ 開始 / 繼續任務</button>
      <div class="msg" id="loginMsg"></div>
      <div class="foot"><a id="lbBtn">🏆 即時排行榜（老師用）</a></div>
    </div>

    <!-- GAME -->
    <div id="game" style="display:none">
      <div class="hd"><span>隊伍：<b id="gTeam"></b> <span id="gChar" style="color:#8fb6bd"></span></span><span class="score">分數 <span id="gScore">0</span></span></div>
      <div class="doors"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div></div>
      <div class="doortitle" id="doorTitle"></div>
      <div class="doordesc" id="doorDesc"></div>
      <label>輸入這道門的 4 位密碼</label>
      <input type="text" id="ans" placeholder="● ● ● ●" maxlength="4" inputmode="numeric" autocomplete="off">
      <button class="go" id="ansGo">▶ 解 鎖</button>
      <div class="msg" id="gMsg"></div>
      <div class="foot"><a id="logout">↩ 換隊 / 回登入</a> &nbsp;·&nbsp; <a id="lbBtn2">🏆 排行榜</a></div>
    </div>
  </div>
</div>

<div id="ov"><div id="ovStage"></div></div>

<div id="lb">
  <h2>🏆 文明復興・即時排行榜</h2>
  <table id="lbTable"><thead><tr><th>名次</th><th>隊伍</th><th>復興官</th><th>進度</th><th>分數</th><th>完成</th></tr></thead><tbody></tbody></table>
  <div class="x"><button onclick="closeLB()">關閉</button>
    <button onclick="resetAll()" style="border-color:#5a1e26;color:#ff8a96">清空全部（重新開課）</button></div>
</div>

<script>
// ===== 各角色三關答案（可改）=====
const ANS = {
  '柳如煙':{ic:'⏳',dm:'時序官',a:['8541','3125','8462'],
    epi:'⏳ 時間，重新流動了。五座鐘樓一起甦醒——滴答，滴答，世界又有了「明天」。'},
  '蕭炎':  {ic:'🏛️',dm:'結構師',a:['1458','4523','7395'],
    epi:'🏛️ 城市，重新站直了。五座高塔點亮燈火，傾頹的大樓挺起腰桿——這座城，又有了脊梁。'},
  '葉修':  {ic:'💾',dm:'資料官',a:['5814','2534','6483'],
    epi:'💾 記憶，失而復得。散落的書頁飛回書架，淡去的文字一個個浮現，回到了人間。'},
  '顧北辰':{ic:'🧭',dm:'導航員',a:['4185','3524','9251'],
    epi:'🧭 星空，重新亮起。千萬顆星辰次第點亮——迷途的世界，終於有了方向。'},
  '唐三':  {ic:'🔋',dm:'生化師',a:['4815','2345','5728'],
    epi:'🔋 生命，重新發光。枯萎的花園抽出新芽，蜜蜂嗡嗡飛舞，重新送上光與電。'},
};
const DOORS=[
  {t:'第一道門・形狀之門',d:'解開「形狀卡」、用解碼表翻出箭頭，輸入第一幕的 4 位密碼。'},
  {t:'第二道門・矩陣之門',d:'用線索推理還原五個位置，輸入第二幕的 4 位密碼。'},
  {t:'第三道門・符文之門',d:'解開符號方程式、算出四個符號的值，輸入第三幕的 4 位密碼。'},
];
const BASE=100, PEN=10, FLOOR=50;   // 每關基礎分、每錯一次扣分、最低分
const DOOR_BONUS=[30,20,10];        // 每道門破門名次獎勵：該門第1組+30、第2組+20、第3組+10，之後+0

// ===== state =====
function load(){ try{ return JSON.parse(localStorage.getItem('civ_teams')||'{}'); }catch(e){ return {}; } }
function save(o){ localStorage.setItem('civ_teams',JSON.stringify(o)); }
let cur=null, pickedChar=null;

// ===== 雲端同步（跨裝置共用排行榜與破門名次）=====
const SYNC='https://kvdb.io/BWBnc5FaEFL5eqBvM8bNQL/';
let cloud={};   // 最近一次從雲端抓到的全部隊伍
function cloudPush(){ if(!cur) return; const t=load()[cur]; if(!t) return;
  try{ fetch(SYNC+encodeURIComponent(cur),{method:'POST',body:JSON.stringify(t)}); }catch(e){} }
async function cloudPull(){ try{ const r=await fetch(SYNC+'?values=true&format=json');
    if(!r.ok) return; const arr=await r.json(); const m={};
    (arr||[]).forEach(pair=>{ try{ let k=pair[0], v=pair[1];
      try{ k=decodeURIComponent(k); }catch(e){}
      if(typeof v==='string') v=JSON.parse(v);
      if(v && typeof v.act==='number') m[k]=v; }catch(e){} });
    cloud=m; }catch(e){} }
// 本機與雲端合併：同隊名取進度較新的（act 高者優先，再比錯誤數/完成狀態）
function mergedDb(){ const local=load(), m={...cloud};
  for(const k in local){ const a=local[k], b=m[k];
    if(!b || a.act>b.act || (a.act===b.act && ((a.wrong||0)>(b.wrong||0) || (a.finish&&!b.finish)))) m[k]=a; }
  return m; }
cloudPull(); setInterval(cloudPull,8000);

// ===== boot sequence (once per browser tab) =====
(function boot(){
  const bootEl=document.getElementById('boot');
  if(sessionStorage.getItem('civ_booted')){ bootEl.remove(); return; }
  const lines=['> INIT 文明復興核心…','> 載入五道人格模組… OK','> 校準邏輯之門… OK','> 連線任務終端… READY'];
  const out=document.getElementById('bootLines'); let i=0, txt='';
  function finish(){ if(bootEl.parentNode){ bootEl.classList.add('hide'); setTimeout(()=>bootEl.remove(),520); } sessionStorage.setItem('civ_booted','1'); }
  bootEl.onclick=finish;
  (function step(){
    if(i>=lines.length){ setTimeout(finish,500); return; }
    txt+= (txt?'\n':'') + lines[i]; out.textContent=txt; beep(500+i*80,.05); i++; setTimeout(step,380);
  })();
})();

// ===== small helpers: typewriter + score count-up =====
function typeText(el,text,speed){ speed=speed||14; el.classList.add('typing'); el.textContent=''; let i=0;
  (function tw(){ if(i<=text.length){ el.textContent=text.slice(0,i); i++; setTimeout(tw,speed); } else el.classList.remove('typing'); })(); }
function bumpScore(el,to){ el.textContent=to; el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),350); }
function lightBurst(){ const c=document.getElementById('confetti'),x=c.getContext('2d'); c.width=innerWidth;c.height=innerHeight;c.style.display='block';
  const cols=['#33e6e6','#46e07a','#ffb84d']; let ps=Array.from({length:40},()=>({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight/2,vy:-(2+Math.random()*4),vx:(Math.random()-.5)*6,s:4+Math.random()*5,col:cols[Math.random()*cols.length|0],rot:Math.random()*6})); let t=0;
  (function fr(){ x.clearRect(0,0,c.width,c.height); t++; ps.forEach(p=>{ p.y+=p.vy; p.vy+=.15; p.x+=p.vx; p.rot+=.12; x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore(); }); if(t<40)requestAnimationFrame(fr); else c.style.display='none'; })();
}

// chars
const charsEl=document.getElementById('chars');
Object.keys(ANS).forEach(n=>{ const d=ANS[n], el=document.createElement('div'); el.className='char';
  el.innerHTML=`<div class="ic">${d.ic}</div><div class="nm">${n}</div><div class="dm">${d.dm}</div>`;
  el.onclick=()=>{ pickedChar=n; [...charsEl.children].forEach(c=>c.classList.remove('sel')); el.classList.add('sel'); };
  charsEl.appendChild(el); });

// login / resume
document.getElementById('loginGo').onclick=()=>{
  const team=document.getElementById('team').value.trim(); const lm=document.getElementById('loginMsg'); lm.className='msg';
  if(!team){ lm.className='msg err'; lm.textContent='請輸入隊名。'; return; }
  let db=load();
  if(db[team]){ cur=team; }              // 繼續
  else{ if(!pickedChar){ lm.className='msg err'; lm.textContent='新隊伍請先選擇復興官。'; return; }
        db[team]={char:pickedChar,act:0,score:0,wrong:0,start:Date.now(),finish:null}; save(db); cur=team; }
  cloudPush(); enterGame();
};
document.getElementById('logout').onclick=()=>{ cur=null; pickedChar=null; [...charsEl.children].forEach(c=>c.classList.remove('sel'));
  document.getElementById('team').value=''; document.getElementById('loginMsg').textContent='';
  show('login'); };

function show(id){ ['login','game'].forEach(s=>document.getElementById(s).style.display=s===id?'block':'none'); }

function enterGame(){
  const t=load()[cur]; show('game');
  document.getElementById('gTeam').textContent=cur;
  document.getElementById('gChar').textContent='（'+ANS[t.char].ic+' '+t.char+'）';
  renderDoor();
}
function renderDoor(){
  const t=load()[cur]; document.getElementById('gScore').textContent=t.score;
  ['d0','d1','d2'].forEach((id,i)=>{ const e=document.getElementById(id); e.className='dot'+(i<t.act?' done':i===t.act?' cur':''); });
  document.getElementById('ans').value=''; document.getElementById('gMsg').textContent='';
  if(t.act>=3){ document.getElementById('doorTitle').textContent='✅ 三道門全開！'; typeText(document.getElementById('doorDesc'),'你已完成全部任務。'); return; }
  document.getElementById('doorTitle').textContent='🚪 '+DOORS[t.act].t;
  typeText(document.getElementById('doorDesc'),DOORS[t.act].d);
}

document.getElementById('ansGo').onclick=submit;
document.getElementById('ans').addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
function submit(){
  let db=load(), t=db[cur]; if(t.act>=3) return;
  const v=document.getElementById('ans').value.replace(/\D/g,''); const gm=document.getElementById('gMsg'); gm.className='msg';
  if(v.length!==4){ gm.className='msg err'; gm.textContent='請輸入 4 位數字。'; return; }
  const correct=ANS[t.char].a[t.act];
  if(v!==correct){ beep(140,.25); t.wrong=(t.wrong||0)+1; db[cur]=t; save(db); cloudPush();
    gm.className='msg err'; gm.textContent='✗ 密碼錯誤，再檢查一次。（每錯一次，本關少 '+PEN+' 分）';
    const panel=document.getElementById('panel'); panel.classList.add('shake','flash-err'); document.body.classList.add('shake-screen');
    setTimeout(()=>{ panel.classList.remove('shake','flash-err'); document.body.classList.remove('shake-screen'); },500); return; }
  // correct
  const wrongThis = t._wrongAtAct ? (t.wrong - t._wrongAtAct) : t.wrong;
  const gain=Math.max(FLOOR, BASE - wrongThis*PEN);
  // 這道門的破門名次（全班含雲端其他裝置，已破過這道門的隊伍數 +1）
  const order=Object.entries(mergedDb()).filter(([k,v])=>k!==cur && v.act>t.act).length+1;
  const sbonus=DOOR_BONUS[order-1]||0;
  t.score+=gain+sbonus; t.act+=1; t._wrongAtAct=t.wrong; db[cur]=t; save(db); cloudPush();
  for(let k=0;k<3;k++) setTimeout(()=>beep(500+k*150,.07),k*70);
  const panel=document.getElementById('panel'); panel.classList.add('flash-ok'); setTimeout(()=>panel.classList.remove('flash-ok'),500);
  bumpScore(document.getElementById('gScore'),t.score); lightBurst();
  if(t.act<3){ gm.className='msg ok';
    gm.textContent='✓ 門開了！＋'+gain+' 分'+(sbonus?'，⚡ 第 '+order+' 組破此門 +'+sbonus+' 分':'')+'。前往下一道門…';
    setTimeout(renderDoor,900); }
  else{ // finished all 3
    t.finish=Date.now(); db[cur]=t; save(db); cloudPush();
    finishSeq(t.char,t.score,sbonus,order); }
}

// ===== reboot finale =====
function finishSeq(name,score,bonus,order){
  const d=ANS[name], ov=document.getElementById('ov'), st=document.getElementById('ovStage'); ov.style.display='flex'; st.innerHTML='';
  const lines=['> 三道門已全開…','> 正在反寫「歸零」核心…','> ⚠ 歸零病毒反抗中…'];
  let stage=document.createElement('div'); stage.id='ovline'; st.appendChild(stage); let i=0;
  (function type(){ if(i<lines.length){ stage.innerHTML=lines.slice(0,i+1).join('<br>'); beep(420+i*120,.08); i++; setTimeout(type,720);} else gl(); })();
  function gl(){ stage.innerHTML='<div class="glitch">ＺＥＲＯ ＥＲＲＯＲ</div>'; beep(90,.5);
    setTimeout(()=>{ st.innerHTML='<div id="ovline">世界重啟中…</div><div class="bar"><i id="bf"></i></div>';
      let p=0,bf=document.getElementById('bf'); const iv=setInterval(()=>{ p+=Math.random()*10+5; if(p>=100){p=100;clearInterval(iv);} bf.style.width=p+'%'; if(p>=100) setTimeout(win,450); },120); },1000); }
  function win(){ st.innerHTML=`<div class="success show">系 統 重 啟 成 功</div><div class="epi" id="epi"></div><div class="prize" id="prize"></div><button class="again" id="again">↻ 換下一組登入</button>`;
    confetti(); document.body.classList.add('shake-screen'); setTimeout(()=>document.body.classList.remove('shake-screen'),500);
    for(let k=0;k<6;k++) setTimeout(()=>beep(700+k*90,.09),k*90);
    const rank=rankOf(cur);
    setTimeout(()=>{ const e=document.getElementById('epi'); e.textContent=d.epi; e.classList.add('show'); },650);
    setTimeout(()=>{ const pz=document.getElementById('prize');
      const spd=bonus>0?`⚡ 第 ${order} 組打開最終之門，速度獎勵 <b>+${bonus}</b> 分！<br>`:'';
      pz.innerHTML=`${spd}🎁 完成！總分 <b>${score}</b> ・ 目前第 <b>${rank}</b> 名<br>「${name}」一脈，文明復興！`; pz.classList.add('show'); },1400);
    setTimeout(()=>{ const a=document.getElementById('again'); a.classList.add('show'); a.onclick=()=>{ ov.style.display='none'; document.getElementById('logout').click(); }; },1700);
  }
}
function rankOf(team){ const fin=Object.entries(mergedDb()).filter(([k,v])=>v.finish).sort(cmp); return fin.findIndex(([k])=>k===team)+1; }
function cmp(a,b){ a=a[1];b=b[1]; if(b.score!==a.score) return b.score-a.score; return (a.finish||9e15)-(b.finish||9e15); }

// ===== leaderboard（雲端＋本機合併，開啟時每 5 秒自動更新）=====
let lbTimer=null;
function renderLB(){ const arr=Object.entries(mergedDb());
  const fin=arr.filter(([k,v])=>v.finish).sort(cmp); const ing=arr.filter(([k,v])=>!v.finish).sort((a,b)=>b[1].score-a[1].score);
  const tb=document.querySelector('#lbTable tbody'); tb.innerHTML='';
  if(!arr.length) tb.innerHTML='<tr><td colspan="6" style="color:#5d7f87">還沒有隊伍登入</td></tr>';
  fin.forEach(([k,v],i)=>{ const m=['🥇','🥈','🥉'][i]||('#'+(i+1)); const tm=v.finish?Math.round((v.finish-v.start)/60000):'';
    tb.innerHTML+=`<tr><td>${m}</td><td>${k}</td><td>${ANS[v.char]?ANS[v.char].ic:''} ${v.char}</td><td style="color:var(--green)">✔ 完成</td><td class="score">${v.score}</td><td>${tm} 分</td></tr>`; });
  ing.forEach(([k,v])=>{ tb.innerHTML+=`<tr><td>—</td><td>${k}</td><td>${ANS[v.char]?ANS[v.char].ic:''} ${v.char}</td><td>${v.act}/3 道門</td><td class="score">${v.score}</td><td>進行中</td></tr>`; });
}
function openLB(){ renderLB(); cloudPull().then(renderLB);
  if(lbTimer) clearInterval(lbTimer);
  lbTimer=setInterval(()=>cloudPull().then(renderLB),5000);
  document.getElementById('lb').style.display='block';
}
document.getElementById('lbBtn').onclick=openLB; document.getElementById('lbBtn2').onclick=openLB;
function closeLB(){ document.getElementById('lb').style.display='none'; if(lbTimer){clearInterval(lbTimer);lbTimer=null;} }
function resetAll(){ if(confirm('確定清空所有隊伍紀錄？(重新開課用，會同時清掉雲端資料)')){
  localStorage.removeItem('civ_teams');
  Object.keys(cloud).forEach(k=>{ try{ fetch(SYNC+encodeURIComponent(k),{method:'POST',body:'0'}); }catch(e){} });
  cloud={}; closeLB(); if(cur){cur=null;document.getElementById('logout').click();} } }

// ===== fx =====
const sc=document.getElementById('stars'),sx=sc.getContext('2d'); let stars=[];
function rs(){ sc.width=innerWidth; sc.height=innerHeight; stars=Array.from({length:110},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.4,a:Math.random()})); }
rs(); addEventListener('resize',rs);
(function tw(){ sx.clearRect(0,0,sc.width,sc.height); stars.forEach(s=>{ s.a+=(Math.random()-.5)*.05; s.a=Math.max(.1,Math.min(1,s.a)); sx.fillStyle='rgba(120,220,230,'+s.a*.7+')'; sx.beginPath(); sx.arc(s.x,s.y,s.r,0,7); sx.fill(); }); requestAnimationFrame(tw); })();
function beep(f,t){ try{ const a=new(window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=f; o.type='square'; g.gain.value=.05; o.start(); o.stop(a.currentTime+t);}catch(e){} }
function confetti(){ const c=document.getElementById('confetti'),x=c.getContext('2d'); c.width=innerWidth;c.height=innerHeight;c.style.display='block';
  const cols=['#33e6e6','#46e07a','#ffb84d','#ff7ab0','#9b8cff']; let ps=Array.from({length:220},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,vy:2+Math.random()*5,vx:(Math.random()-.5)*2.4,s:4+Math.random()*7,col:cols[Math.random()*cols.length|0],rot:Math.random()*6})); let t=0;
  (function fr(){ x.clearRect(0,0,c.width,c.height); t++; ps.forEach(p=>{ p.y+=p.vy;p.x+=p.vx;p.rot+=.1; x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore(); }); if(t<260)requestAnimationFrame(fr); else c.style.display='none'; })(); }
</script>
